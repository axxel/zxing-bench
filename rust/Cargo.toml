version = "0.1.5"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = "0.25.*"
image24 = { package = "image", version = "0.24" }
# zxing-cpp = { path = "../../zxing-cpp.git/wrappers/rust", features = ["bundled", "image"] }
zxing-cpp = { version = "0.5.4", features = ["bundled", "image"] }
rxing = { version = "0.9.4", features = ["image"] }
zbar-rust = "0.1.1"
zedbar = "0.7.0"
bardecoder = "0.5.0"
rqrr = { version = "0.11.0", features = ["image"] }
