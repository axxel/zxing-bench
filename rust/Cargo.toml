[package]
name = "zxing-bench"
version = "0.1.5"
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
image = "0.25.*"
image24 = { package = "image", version = "0.24" }
zxing-cpp = { version = "0.5.3", features = ["bundled", "image"] }
